name: Integrate Phase 3 location pages into sitemap
on:
  push:
    branches: [location-pages-phase-3]
    paths: [.github/workflows/update-location-sitemap-phase3.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: location-pages-phase-3
          fetch-depth: 0
      - name: Update sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sitemap.xml')
          s = p.read_text()
          urls = [
            'https://jeddsarte.com/locations/texas/dallas-fort-worth/',
            'https://jeddsarte.com/locations/texas/austin/',
            'https://jeddsarte.com/locations/texas/san-antonio/',
            'https://jeddsarte.com/locations/florida/',
            'https://jeddsarte.com/locations/florida/miami/',
            'https://jeddsarte.com/locations/florida/tampa/',
            'https://jeddsarte.com/locations/florida/orlando/',
            'https://jeddsarte.com/locations/georgia/',
            'https://jeddsarte.com/locations/georgia/atlanta/',
            'https://jeddsarte.com/locations/north-carolina/',
            'https://jeddsarte.com/locations/north-carolina/charlotte/',
            'https://jeddsarte.com/locations/north-carolina/raleigh/',
            'https://jeddsarte.com/locations/illinois/',
            'https://jeddsarte.com/locations/illinois/chicago/',
            'https://jeddsarte.com/locations/arizona/',
            'https://jeddsarte.com/locations/arizona/phoenix/'
          ]
          marker = '  <!-- Case study pages -->'
          if marker not in s:
              raise SystemExit('sitemap insertion marker missing')
          block = ''
          for u in urls:
              if u not in s:
                  priority = '0.7' if u.rstrip('/').split('/')[-1] in {'florida','georgia','north-carolina','illinois','arizona'} else '0.8'
                  block += f'  <url>\n    <loc>{u}</loc>\n    <lastmod>2026-09-14</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>{priority}</priority>\n  </url>\n'
          if block:
              s = s.replace(marker, block + '\n' + marker, 1)
              p.write_text(s)
          PY
      - name: Commit sitemap and remove temporary workflow
        run: |
          rm .github/workflows/update-location-sitemap-phase3.yml
          git config user.name 'Jedd Site Bot'
          git config user.email 'site-bot@users.noreply.github.com'
          git add sitemap.xml .github/workflows/update-location-sitemap-phase3.yml
          git commit -m 'Add Phase 3 location pages to sitemap'
          git push origin location-pages-phase-3