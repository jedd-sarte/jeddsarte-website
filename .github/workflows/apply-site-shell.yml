name: Apply Shared Site Shell

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-shell:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'sitewide header and footer')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add shared shell script to every HTML page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tag = '<script defer src="/assets/site-shell.js"></script>'
          changed = 0
          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              if tag in s:
                  continue
              if '</head>' in s:
                  s = s.replace('</head>', f'{tag}</head>', 1)
                  p.write_text(s, encoding='utf-8')
                  changed += 1
          print(f'updated {changed} HTML files')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/apply-site-shell.yml

      - name: Commit rollout
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply shared header and footer across site"
          git push origin main