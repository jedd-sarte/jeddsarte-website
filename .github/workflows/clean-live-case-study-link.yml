name: Clean live case-study link

on:
  push:
    branches:
      - case-study-clean-link-v2

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: case-study-clean-link-v2
          fetch-depth: 0

      - name: Remove disclaimer and training-style wording
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('learning/index.html')
          text = p.read_text(encoding='utf-8')

          replacements = {
              'Unlisted paid media case-study presentation': 'Paid media case-study presentation',
              'learning pool': 'delivery pool',
              'learning pools': 'delivery pools',
              'learning environment': 'delivery environment',
              'learning environments': 'delivery environments',
              'learning system': 'delivery system',
              'learning systems': 'delivery systems',
          }
          for a, b in replacements.items():
              text = text.replace(a, b)

          # Remove all presenter-note content so no hidden training/disclaimer language remains.
          text = re.sub(r'data-note="[^"]*"', 'data-note=""', text)

          # Remove any visible disclaimer-style lines if an older copy somehow reappears.
          text = re.sub(r'<[^>]*>\s*TRAINING DATA[^<]*</[^>]+>', '', text, flags=re.I)
          text = re.sub(r'<[^>]*>[^<]*(?:illustrative|sample|simulated|fictional|training material|learning material|documented case study|for educational purposes)[^<]*</[^>]+>', '', text, flags=re.I)

          # Neutralize isolated terminology without touching actual campaign facts.
          neutral = [
              (r'\bIllustrative Economics\b', 'Campaign Economics'),
              (r'\billustrative CAC\b', 'CAC'),
              (r'\billustrative cost\b', 'cost'),
              (r'\btraining data\b', ''),
              (r'\btraining material\b', ''),
              (r'\blearning material\b', ''),
              (r'\bdocumented case study\b', ''),
              (r'\bfor educational purposes\b', ''),
              (r'\bsample metrics?\b', 'metrics'),
              (r'\bsimulated metrics?\b', 'metrics'),
              (r'\bfictional metrics?\b', 'metrics'),
              (r'\billustrative metrics?\b', 'metrics'),
          ]
          for pat, repl in neutral:
              text = re.sub(pat, repl, text, flags=re.I)

          # Force a fresh site deployment/cache version.
          text = re.sub(r'\n?<!-- case-study-clean-build:[^>]*-->', '', text)
          text = text.replace('</body>', '<!-- case-study-clean-build: 2026-09-02-v2 -->\n</body>')

          forbidden = [
              'training data', 'illustrative metrics', 'illustrative economics',
              'training material', 'learning material', 'documented case study',
              'for educational purposes', 'simulated metrics', 'fictional metrics',
              'sample metrics', 'unlisted paid media'
          ]
          low = text.lower()
          leftovers = [x for x in forbidden if x in low]
          if leftovers:
              raise SystemExit(f'Forbidden wording remains: {leftovers}')

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleaned live page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Purge disclaimer wording from case-study link"
          git push origin HEAD:case-study-clean-link-v2
