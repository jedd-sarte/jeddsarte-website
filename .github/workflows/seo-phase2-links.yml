name: SEO Phase 2 Experience Cleanup

on:
  push:
    branches:
      - seo-phase-2
    paths:
      - .github/workflows/seo-phase2-links.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-phase-2
          fetch-depth: 0

      - name: Apply guarded article cleanup
        shell: python
        run: |
          from pathlib import Path

          path = Path("blog/law-firm-google-ads-mistakes/index.html")
          text = path.read_text(encoding="utf-8")
          replacements = [
            (
              'Written by a paid media specialist with 5+ years managing legal campaigns.',
              'Written by a paid media specialist with 6+ years of digital marketing experience.'
            ),
            (
              'In five years of auditing and managing Google Ads for U.S. law firms, I have looked at dozens of accounts across personal injury, corporate defense, family law, and mediation practices.',
              'Across years of auditing and managing Google Ads for U.S. law firms, I have looked at dozens of accounts across personal injury, corporate defense, family law, and mediation practices.'
            )
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected 1 match, found {count}: {old[:120]!r}")
              text = text.replace(old, new)
              print(f"Replaced: {old[:80]}")
          path.write_text(text, encoding="utf-8")

      - name: Commit cleanup
        run: |
          git config user.name "jedd-sarte-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog/law-firm-google-ads-mistakes/index.html
          git diff --cached --check
          git commit -m "Standardize article experience positioning"
          git push origin seo-phase-2