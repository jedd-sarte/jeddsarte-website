name: SEO Phase 2 Internal Links

on:
  push:
    branches:
      - seo-phase-2
    paths:
      - .github/workflows/seo-phase2-links.yml

permissions:
  contents: write

jobs:
  link-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-phase-2
          fetch-depth: 0

      - name: Add guarded internal links
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")
              print(f"{path}: replaced {count} occurrence(s)")

          services = "services/index.html"
          replace_exact(services,
            '<div class="svc-tag-row"><span class="svc-tag">Google Ads</span><span class="svc-tag">Meta Ads</span><span class="svc-tag">LinkedIn Ads</span><span class="svc-tag">TikTok Ads</span></div>',
            '<div class="svc-tag-row"><span class="svc-tag">Google Ads</span><a class="svc-tag" href="meta-ads-management/">Meta Ads</a><span class="svc-tag">LinkedIn Ads</span><span class="svc-tag">TikTok Ads</span></div>')
          replace_exact(services,
            '<h3>Tracking & Data Infrastructure</h3>',
            '<h3><a href="conversion-tracking/" style="color:inherit;text-decoration:none">Tracking & Data Infrastructure</a></h3>')
          replace_exact(services,
            '<h3>Home Services & Contractors</h3>',
            '<h3><a href="../industries/google-ads-contractors/" style="color:inherit;text-decoration:none">Home Services & Contractors</a></h3>')

      - name: Audit experience-year references
        run: |
          echo "Potential 5+/7+ references still present:"
          grep -REn --include='*.html' '(^|[^0-9])(5\+|7\+)[^0-9]' . || true

      - name: Commit internal links
        run: |
          git config user.name "jedd-sarte-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add services/index.html
          git diff --cached --check
          git commit -m "Link Phase 2 SEO pages from services hub"
          git push origin seo-phase-2