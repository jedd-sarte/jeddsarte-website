name: Ungate Case Studies

on:
  push:
    branches: [seo-case-study-ungating]
    paths:
      - .github/workflows/ungate-case-studies.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-case-study-ungating
      - name: Run guarded cleanup
        run: python scripts/ungate_case_studies.py
      - name: Commit cleaned portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html case-studies/index.html case-studies/pi-law-firm/index.html case-studies/b2b-corporate-law/index.html case-studies/complex-litigation/index.html
          git commit -m "Open case study library and remove access gates"
          git push
