name: SEO Final Tune

on:
  push:
    branches:
      - seo-legacy-cleanup
    paths:
      - .github/workflows/seo-final-tune.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-legacy-cleanup
          fetch-depth: 0

      - name: Apply guarded final SEO tuning
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")
              print(f"{path}: replaced {count} occurrence(s)")

          home = "index.html"
          old_title = "Google Ads & Paid Media Specialist for U.S. Businesses | Jedd Sarte"
          new_title = "Google Ads & Paid Media Specialist | Jedd Sarte"
          replace_exact(home, f"<title>{old_title}</title>", f"<title>{new_title}</title>")
          replace_exact(home,
            '<meta name="description" content="Google Ads and paid media specialist with 6+ years of digital marketing experience helping U.S. law firms, home service companies, e-commerce brands, and other businesses improve acquisition through paid search, paid social, tracking, and funnel strategy." />',
            '<meta name="description" content="Google Ads and paid media specialist with 6+ years of digital marketing experience helping U.S. businesses improve leads, sales, tracking, and ROAS." />')
          replace_exact(home,
            f'<meta property="og:title" content="{old_title}" />',
            f'<meta property="og:title" content="{new_title}" />')
          replace_exact(home,
            f'<meta name="twitter:title" content="{old_title}" />',
            f'<meta name="twitter:title" content="{new_title}" />')
          replace_exact(home,
            f'"name": "{old_title}",',
            f'"name": "{new_title}",')
          replace_exact(home,
            '"dateModified": "2026-07-15",',
            '"dateModified": "2026-09-01",')
          replace_exact(home,
            'Page last updated <time datetime="2026-07-15">July 15, 2026</time>',
            'Page last updated <time datetime="2026-09-01">September 1, 2026</time>')
          replace_exact(home,
            '<span class="clink-icon">✉️</span>jedd@yourdomain.com',
            '<span class="clink-icon">✉️</span>jedd.digital@gmail.com')

          blog_links = [
              ("01", "blog/law-firm-google-ads-mistakes/"),
              ("02", "blog/server-side-gtm-vs-browser-tracking/"),
              ("03", "blog/value-based-bidding-law-firms/"),
              ("04", "blog/meta-capi-law-firms/"),
              ("05", "blog/landing-page-lead-quality/"),
              ("06", "blog/lsa-vs-search-ads-contractors/"),
              ("07", "blog/offline-conversion-tracking/"),
              ("08", "blog/google-ads-audit-checklist/"),
              ("09", "blog/google-ads-high-ticket-b2b/"),
              ("10", "blog/multi-touch-attribution-model/"),
          ]
          for number, href in blog_links:
              replace_exact(home,
                f'<a href="#" class="blog-card fade-up">\n        <div class="blog-thumb"><div class="bt-num">{number}</div>',
                f'<a href="{href}" class="blog-card fade-up">\n        <div class="blog-thumb"><div class="bt-num">{number}</div>')

          services = "services/index.html"
          replace_exact(services,
            '<meta name="description" content="Paid media management, account audits, server-side tracking infrastructure, landing pages, and funnel strategy for U.S. law firms, contractors, and e-commerce brands."/>',
            '<meta name="description" content="Google Ads and paid media management, account audits, conversion tracking, landing pages, and funnel strategy for U.S. businesses."/>')

          sitemap = "sitemap.xml"
          replace_exact(sitemap,
            '    <loc>https://jeddsarte.com/</loc>\n    <lastmod>2026-07-06</lastmod>',
            '    <loc>https://jeddsarte.com/</loc>\n    <lastmod>2026-09-01</lastmod>')
          replace_exact(sitemap,
            '    <loc>https://jeddsarte.com/services/</loc>\n    <lastmod>2026-07-06</lastmod>',
            '    <loc>https://jeddsarte.com/services/</loc>\n    <lastmod>2026-09-01</lastmod>')

      - name: Commit tuning
        run: |
          git config user.name "jedd-sarte-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html services/index.html sitemap.xml
          git diff --cached --check
          git commit -m "Tighten metadata and restore homepage internal links"
          git push origin seo-legacy-cleanup
