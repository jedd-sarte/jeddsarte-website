name: SEO Phase 3B Blog Card Renumber
on:
  push:
    branches: [seo-phase-3b]
    paths: [.github/workflows/seo-phase3b-renumber.yml]
permissions:
  contents: write
jobs:
  renumber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-phase-3b
      - name: Renumber existing blog cards
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('blog/index.html'); text=p.read_text(encoding='utf-8')
          mapping=[
            ('server-side-gtm-vs-browser-tracking','05'),
            ('value-based-bidding-law-firms','06'),
            ('meta-capi-law-firms','07'),
            ('landing-page-lead-quality','08'),
            ('lsa-vs-search-ads-contractors','09'),
            ('offline-conversion-tracking','10'),
            ('google-ads-audit-checklist','11'),
            ('google-ads-high-ticket-b2b','12'),
            ('multi-touch-attribution-model','13'),
          ]
          for slug,num in mapping:
              pattern=r'(<a href="\./'+re.escape(slug)+r'/" class="post-card fade-up">\s*<div class="pc-thumb">\s*<div class="pc-thumb-num">)(\d+)(</div>)'
              text,count=re.subn(pattern,lambda m:m.group(1)+num+m.group(3),text,count=1)
              if count != 1:
                  raise SystemExit(f'{slug}: expected one card, found {count}')
          p.write_text(text,encoding='utf-8')
      - name: Commit numbering cleanup
        run: |
          git config user.name "Jedd Sarte"
          git config user.email "ajeddsarte@gmail.com"
          git add blog/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Renumber blog cards for Phase 3B"
          git push origin seo-phase-3b