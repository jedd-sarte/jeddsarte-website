name: Update Experience Years

on:
  push:
    branches: [fix-7-years-experience]
    paths:
      - .github/workflows/update-experience-years.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-7-years-experience
      - name: Update factual experience wording
        run: python scripts/update_experience_years.py
      - name: Show changed HTML
        run: git diff --stat && git diff -- '*.html'
      - name: Commit experience correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git commit -m "Update digital marketing experience to 7 years"
          git push
