name: SEO Phase 3A Homepage and Internal Links

on:
  push:
    branches:
      - seo-phase-3a
    paths:
      - .github/workflows/seo-phase3a-internal-links.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-phase-3a
          fetch-depth: 0

      - name: Apply guarded SEO and internal-link updates
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old[:180]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")
              print(f"{path}: replaced {count} occurrence(s)")

          # Homepage: align positioning, structured data, credentials, and money-page links.
          path = "index.html"
          replace_exact(path,
            ".svc h3{color:var(--white);margin-bottom:10px;font-size:1rem}",
            ".svc h3{color:var(--white);margin-bottom:10px;font-size:1rem}.svc h3 a{color:inherit;text-decoration:none}")
          replace_exact(path,
            ".svc-tag{font-size:0.68rem;font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--gold);background:rgba(244,159,28,0.1);padding:4px 9px;border-radius:4px;letter-spacing:0.05em}",
            ".svc-tag{font-size:0.68rem;font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--gold);background:rgba(244,159,28,0.1);padding:4px 9px;border-radius:4px;letter-spacing:0.05em;text-decoration:none}")
          replace_exact(path,
            ".cert-badge:hover img{opacity:1;filter:drop-shadow(0 0 6px rgba(244,159,28,0.3))}",
            ".cert-badge:hover img{opacity:1;filter:drop-shadow(0 0 6px rgba(244,159,28,0.3))}.cert-text{height:48px;display:flex;align-items:center;padding:0 12px;border:1px solid rgba(255,255,255,0.16);border-radius:7px;color:rgba(255,255,255,0.85);font:700 0.72rem 'Space Grotesk',sans-serif;line-height:1.2;text-align:center}")
          replace_exact(path,
            '        "Google Ads",\n        "Meta Ads",\n        "LinkedIn Ads",\n        "TikTok Ads",\n        "Paid Media Strategy",',
            '        "Google Ads",\n        "Meta Ads",\n        "SEO",\n        "Google Analytics",\n        "Paid Media Strategy",')
          replace_exact(path,
            '        {\n          "@type": "EducationalOccupationalCredential",\n          "name": "Amazon Ads Certified",\n          "credentialCategory": "Professional Certification",\n          "recognizedBy": {\n            "@type": "Organization",\n            "name": "Amazon"\n          }\n        }',
            '        {\n          "@type": "EducationalOccupationalCredential",\n          "name": "Certified BrightEdge SEO Professional",\n          "credentialCategory": "Professional Certification",\n          "recognizedBy": {\n            "@type": "Organization",\n            "name": "BrightEdge"\n          }\n        }')
          replace_exact(path,
            '      "description": "Full-service paid media management including Google Ads, Meta Ads, LinkedIn Ads, TikTok Ads, tracking infrastructure, landing pages, and conversion funnel strategy.",',
            '      "description": "Paid media and acquisition services centered on Google Ads, Meta Ads, conversion tracking, landing pages, SEO, and conversion funnel strategy.",')
          replace_exact(path,
            '      "serviceType": [\n        "Paid Media Management",\n        "Google Ads Management",\n        "Meta Ads Management",\n        "LinkedIn Ads Management",\n        "Account Audit",\n        "Conversion Tracking Setup",\n        "Landing Page Design",\n        "Legal Industry Advertising"\n      ],',
            '      "serviceType": [\n        "Paid Media Management",\n        "Google Ads Management",\n        "Meta Ads Management",\n        "Google Ads Audit",\n        "Conversion Tracking Setup",\n        "Landing Page Design",\n        "Legal Industry Advertising",\n        "Contractor Advertising",\n        "E-commerce Advertising"\n      ],')
          replace_exact(path,
            '              "description": "Full campaign management across Google Ads, Meta Ads, LinkedIn Ads, and TikTok Ads."',
            '              "description": "Full campaign management centered on Google Ads and Meta Ads, supported by conversion tracking and funnel strategy."')
          replace_exact(path,
            '<p class="hero-sub"><strong style="color:rgba(255,255,255,0.82);font-weight:600">Google Ads & Paid Media Specialist</strong> with 6+ years of digital marketing experience across Google, Meta, LinkedIn & TikTok Ads for U.S. law firms, home service companies, e-commerce brands, and other businesses. I build campaigns tied to real business outcomes  -  qualified leads, signed clients, purchases, booked jobs, and revenue.</p>',
            '<p class="hero-sub"><strong style="color:rgba(255,255,255,0.82);font-weight:600">Google Ads & Paid Media Specialist</strong> with 6+ years of digital marketing experience across Google Ads, Meta Ads, SEO, analytics, and conversion tracking for U.S. law firms, home service companies, e-commerce brands, and other businesses. I build campaigns tied to real business outcomes  -  qualified leads, signed clients, purchases, booked jobs, and revenue.</p>')
          replace_exact(path,
            '<p style="margin-top:18px;font-size:0.82rem;color:rgba(255,255,255,0.45)">Explore <a href="services/google-ads-management/" style="color:#f49f1c;font-weight:600">Google Ads management</a>, <a href="services/google-ads-audit/" style="color:#f49f1c;font-weight:600">Google Ads audits</a>, or <a href="industries/law-firm-google-ads/" style="color:#f49f1c;font-weight:600">Google Ads for law firms</a>.</p>',
            '<p style="margin-top:18px;font-size:0.82rem;color:rgba(255,255,255,0.45)">Explore <a href="services/google-ads-management/" style="color:#f49f1c;font-weight:600">Google Ads management</a>, <a href="services/google-ads-audit/" style="color:#f49f1c;font-weight:600">Google Ads audits</a>, <a href="services/meta-ads-management/" style="color:#f49f1c;font-weight:600">Meta Ads management</a>, <a href="services/conversion-tracking/" style="color:#f49f1c;font-weight:600">conversion tracking</a>, or industry strategies for <a href="industries/law-firm-google-ads/" style="color:#f49f1c;font-weight:600">law firms</a>, <a href="industries/google-ads-contractors/" style="color:#f49f1c;font-weight:600">contractors</a>, and <a href="industries/ecommerce-google-ads/" style="color:#f49f1c;font-weight:600">e-commerce</a>.</p>')
          replace_exact(path,
            '<div class="cert-badge"><img src="assets/images/amazon-ads-certified.webp" alt="Amazon Ads Certified" width="100" height="48" loading="lazy"/></div>',
            '<div class="cert-badge"><span class="cert-text">BrightEdge SEO<br>Professional</span></div>')
          replace_exact(path,
            '<div class="stat-big">4</div>\n          <div class="stat-lbl">Ad Platforms Managed Daily</div>',
            '<div class="stat-big">2</div>\n          <div class="stat-lbl">Core Paid Media Platforms · Google + Meta</div>')
          replace_exact(path,
            '<h3>Paid Media Management</h3>\n        <p>Full campaign management across all major ad platforms. Specifically, that includes strategy, build, creative direction, bid management, and monthly reporting.</p>\n        <div class="svc-tags"><span class="svc-tag">Google Ads</span><span class="svc-tag">Meta Ads</span><span class="svc-tag">LinkedIn</span><span class="svc-tag">TikTok</span></div>',
            '<h3><a href="services/google-ads-management/">Paid Media Management</a></h3>\n        <p>Full campaign management centered on Google Ads and Meta Ads. Specifically, that includes strategy, build, creative direction, bid management, conversion measurement, and performance reporting.</p>\n        <div class="svc-tags"><a class="svc-tag" href="services/google-ads-management/">Google Ads</a><a class="svc-tag" href="services/meta-ads-management/">Meta Ads</a></div>')
          replace_exact(path,
            '<h3>Account Audit & Sprint Plan</h3>',
            '<h3><a href="services/google-ads-audit/">Account Audit & Sprint Plan</a></h3>')
          replace_exact(path,
            '<h3>Tracking & Data Infrastructure</h3>',
            '<h3><a href="services/conversion-tracking/">Tracking & Data Infrastructure</a></h3>')
          replace_exact(path,
            '<h3>Legal Industry Campaigns</h3>',
            '<h3><a href="industries/law-firm-google-ads/">Legal Industry Campaigns</a></h3>')
          replace_exact(path,
            '<h3>Home Services & Contractors</h3>',
            '<h3><a href="industries/google-ads-contractors/">Home Services & Contractors</a></h3>')
          replace_exact(path,
            '<h3>Attorney Daryl A. Gray  -  High-Value PI Law</h3>',
            '<h3><a href="case-studies/pi-law-firm/" style="color:inherit;text-decoration:none">Attorney Daryl A. Gray  -  High-Value PI Law</a></h3>')
          replace_exact(path,
            '<h3>B2B Corporate Defense Firm  -  B2B Corporate Defense</h3>',
            '<h3><a href="case-studies/b2b-corporate-law/" style="color:inherit;text-decoration:none">B2B Corporate Defense Firm  -  B2B Corporate Defense</a></h3>')
          replace_exact(path,
            '<h3>High-Tier Trial Litigation Practice  -  Complex Civil Litigation</h3>',
            '<h3><a href="case-studies/complex-litigation/" style="color:inherit;text-decoration:none">High-Tier Trial Litigation Practice  -  Complex Civil Litigation</a></h3>')
          replace_exact(path,
            '        <a href="services/">Services</a>\n        <a href="case-studies/">Work</a>',
            '        <a href="services/">Services</a>\n        <a href="services/google-ads-management/">Google Ads</a>\n        <a href="services/conversion-tracking/">Tracking</a>\n        <a href="case-studies/">Work</a>')

          # Services hub: keep the commercial positioning consistent with the homepage.
          path = "services/index.html"
          replace_exact(path,
            '<div class="his"><div class="his-num">4</div><div class="his-lbl">Platforms daily</div></div>',
            '<div class="his"><div class="his-num">2</div><div class="his-lbl">Core platforms · Google + Meta</div></div>')
          replace_exact(path,
            '<div class="svc-tag-row"><span class="svc-tag">Google Ads</span><a class="svc-tag" href="meta-ads-management/">Meta Ads</a><span class="svc-tag">LinkedIn Ads</span><span class="svc-tag">TikTok Ads</span></div>',
            '<div class="svc-tag-row"><span class="svc-tag">Google Ads</span><a class="svc-tag" href="meta-ads-management/">Meta Ads</a><span class="svc-tag">Conversion Tracking</span></div>')
          replace_exact(path,
            'Full-cycle campaign management across all major platforms. I handle everything from strategy and campaign architecture to creative direction, bid management, and monthly performance reporting  -  so you can focus on running your business.',
            'Full-cycle campaign management centered on Google Ads and Meta Ads. I handle everything from strategy and campaign architecture to creative direction, bid management, conversion measurement, and performance reporting  -  so you can focus on running your business.')

          # Commercial article -> service/industry bridges.
          replace_exact("blog/google-ads-audit-checklist/index.html",
            '<a href="../../index.html#audit">Get a Free Audit</a>',
            '<a href="../../services/google-ads-audit/">See Google Ads Audit Service</a>')
          replace_exact("blog/offline-conversion-tracking/index.html",
            '<a href="../../services/">See Tracking Service</a>',
            '<a href="../../services/conversion-tracking/">See Conversion Tracking Service</a>')
          replace_exact("blog/lsa-vs-search-ads-contractors/index.html",
            '<a href="../../services/#services">Home Services and Contractors service page</a>',
            '<a href="../../industries/google-ads-contractors/">Google Ads for Contractors service page</a>')
          replace_exact("blog/meta-capi-law-firms/index.html",
            '<a href="../../index.html#audit">Get a Free Audit</a>',
            '<a href="../../services/meta-ads-management/">See Meta Ads Management</a>')
          replace_exact("blog/law-firm-google-ads-mistakes/index.html",
            '<p>If you want to see what a correctly structured legal campaign looks like end to end, the <a href="../../case-studies/pi-law-firm/">PI Law Firm case study</a> covers the full build - infrastructure, bidding model, landing pages, and results.</p>',
            '<p>For the service-side framework, see <a href="../../industries/law-firm-google-ads/">Google Ads for law firms</a>. If you want to see what a correctly structured legal campaign looks like end to end, the <a href="../../case-studies/pi-law-firm/">PI Law Firm case study</a> covers the full build - infrastructure, bidding model, landing pages, and results.</p>')

          # Case studies -> relevant commercial pages.
          replace_exact("case-studies/pi-law-firm/index.html",
            '<p>Running a law firm with Google Ads? Let\'s talk about whether a value-based bidding model makes sense for your practice.</p>',
            '<p>Running a law firm with Google Ads? Review my <a href="../../industries/law-firm-google-ads/" style="color:var(--gold)">Google Ads for law firms approach</a>, then let\'s talk about whether a value-based bidding model makes sense for your practice.</p>')
          replace_exact("case-studies/ecommerce/waxit-car-care-australia/index.html",
            '<p class="closing-note">Figures in this case study are drawn directly from working audit files, the search-term classification workbook, and its accompanying regression-test suite and review ledger maintained throughout the engagement. Client and account details are shared with the understanding that this work is being presented as a professional portfolio reference.</p>',
            '<p class="closing-note"><strong>Related services:</strong> <a href="../../../industries/ecommerce-google-ads/">Google Ads for e-commerce</a> and <a href="../../../services/google-ads-management/">Google Ads management</a>.</p>\n    <p class="closing-note">Figures in this case study are drawn directly from working audit files, the search-term classification workbook, and its accompanying regression-test suite and review ledger maintained throughout the engagement. Client and account details are shared with the understanding that this work is being presented as a professional portfolio reference.</p>')

      - name: Validate HTML link targets exist
        shell: python
        run: |
          from pathlib import Path
          targets = [
            "services/google-ads-management/index.html",
            "services/google-ads-audit/index.html",
            "services/meta-ads-management/index.html",
            "services/conversion-tracking/index.html",
            "industries/law-firm-google-ads/index.html",
            "industries/google-ads-contractors/index.html",
            "industries/ecommerce-google-ads/index.html",
            "case-studies/pi-law-firm/index.html",
            "case-studies/b2b-corporate-law/index.html",
            "case-studies/complex-litigation/index.html",
          ]
          missing = [p for p in targets if not Path(p).exists()]
          if missing:
              raise SystemExit(f"Missing internal-link targets: {missing}")
          print("All priority internal-link targets exist")

      - name: Commit Phase 3A website updates
        run: |
          git config user.name "jedd-sarte-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html services/index.html blog/google-ads-audit-checklist/index.html blog/offline-conversion-tracking/index.html blog/lsa-vs-search-ads-contractors/index.html blog/meta-capi-law-firms/index.html blog/law-firm-google-ads-mistakes/index.html case-studies/pi-law-firm/index.html case-studies/ecommerce/waxit-car-care-australia/index.html
          git diff --cached --check
          git commit -m "Strengthen homepage SEO and commercial internal links"
          git push origin seo-phase-3a