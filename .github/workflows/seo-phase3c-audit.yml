name: SEO Phase 3C Technical Audit

on:
  push:
    branches:
      - seo-phase-3c-audit
    paths:
      - .github/workflows/seo-phase3c-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-phase-3c-audit

      - name: Audit technical SEO
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          import json, xml.etree.ElementTree as ET

          ROOT = Path('.').resolve()
          SITE = 'https://jeddsarte.com'
          html_files = sorted(p for p in Path('.').rglob('*.html') if '.github' not in p.parts and p.name != '404.html')

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title_parts=[]; self.in_title=False; self.h1=0
                  self.descriptions=[]; self.canonicals=[]; self.hrefs=[]; self.srcs=[]
                  self.in_jsonld=False; self.jsonld_buf=[]; self.jsonlds=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='title': self.in_title=True
                  if tag=='h1': self.h1 += 1
                  if tag=='meta' and a.get('name','').lower()=='description': self.descriptions.append(a.get('content',''))
                  if tag=='link' and a.get('rel','').lower()=='canonical': self.canonicals.append(a.get('href',''))
                  if tag=='a' and 'href' in a: self.hrefs.append(a['href'])
                  if tag in ('img','script') and 'src' in a: self.srcs.append(a['src'])
                  if tag=='link' and 'href' in a and a.get('rel','').lower() in ('stylesheet','icon','preload'): self.srcs.append(a['href'])
                  if tag=='script' and a.get('type','').lower()=='application/ld+json':
                      self.in_jsonld=True; self.jsonld_buf=[]
              def handle_endtag(self, tag):
                  if tag=='title': self.in_title=False
                  if tag=='script' and self.in_jsonld:
                      self.in_jsonld=False
                      self.jsonlds.append(''.join(self.jsonld_buf).strip())
              def handle_data(self, data):
                  if self.in_title: self.title_parts.append(data)
                  if self.in_jsonld: self.jsonld_buf.append(data)

          def public_url(p):
              rel=p.relative_to(Path('.'))
              if str(rel)=='index.html': return SITE+'/'
              if rel.name=='index.html': return SITE+'/'+rel.parent.as_posix().strip('/')+'/'
              return SITE+'/'+rel.as_posix()

          def local_target(source, raw):
              if not raw or raw.startswith(('#','mailto:','tel:','javascript:','data:')): return None
              u=urlsplit(raw)
              if u.scheme or u.netloc: return None
              path=unquote(u.path)
              if not path: return None
              base=source.parent
              candidate=(base/path).resolve()
              try: candidate.relative_to(ROOT)
              except ValueError: return ('OUTSIDE', candidate)
              p=Path(candidate)
              if path.endswith('/'):
                  return ('FILE', p/'index.html')
              if p.is_dir(): return ('FILE', p/'index.html')
              return ('FILE', p)

          critical=[]; warnings=[]; page_data={}
          all_titles={}; all_desc={}; canon_to_page={}

          print(f'Auditing {len(html_files)} HTML pages')
          for p in html_files:
              text=p.read_text(encoding='utf-8')
              parser=Parser(); parser.feed(text)
              title=' '.join(''.join(parser.title_parts).split())
              desc=parser.descriptions[0].strip() if parser.descriptions else ''
              url=public_url(p)
              page_data[url]=p

              if not title: critical.append(f'{p}: missing title')
              if len(parser.descriptions)!=1: critical.append(f'{p}: expected 1 meta description, found {len(parser.descriptions)}')
              if len(parser.canonicals)!=1: critical.append(f'{p}: expected 1 canonical, found {len(parser.canonicals)}')
              elif parser.canonicals[0] != url: critical.append(f'{p}: canonical {parser.canonicals[0]!r} != expected {url!r}')
              if parser.h1 != 1: critical.append(f'{p}: expected 1 H1, found {parser.h1}')
              if title:
                  if title in all_titles: warnings.append(f'Duplicate title: {p} and {all_titles[title]} => {title}')
                  all_titles[title]=p
              if desc:
                  if desc in all_desc: warnings.append(f'Duplicate meta description: {p} and {all_desc[desc]}')
                  all_desc[desc]=p
              for raw in parser.hrefs:
                  if raw == '#': warnings.append(f'{p}: placeholder href="#"')
                  target=local_target(p, raw)
                  if target and target[0]=='FILE' and not target[1].exists(): critical.append(f'{p}: broken internal href {raw!r} -> {target[1].relative_to(ROOT) if str(target[1]).startswith(str(ROOT)) else target[1]}')
                  elif target and target[0]=='OUTSIDE': critical.append(f'{p}: internal href escapes repo {raw!r}')
              for raw in parser.srcs:
                  target=local_target(p, raw)
                  if target and target[0]=='FILE' and not target[1].exists(): critical.append(f'{p}: broken local asset {raw!r}')
              for i, block in enumerate(parser.jsonlds,1):
                  if block:
                      try: json.loads(block)
                      except Exception as e: critical.append(f'{p}: invalid JSON-LD block {i}: {e}')

          # Sitemap coverage and validity
          sm=Path('sitemap.xml')
          if not sm.exists(): critical.append('Missing sitemap.xml')
          else:
              try:
                  tree=ET.parse(sm)
                  ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
                  sitemap_urls=[(n.text or '').strip() for n in tree.findall('.//sm:loc',ns)]
                  sitemap_set=set(sitemap_urls)
                  public_set=set(page_data)
                  missing=sorted(public_set-sitemap_set)
                  extras=sorted(sitemap_set-public_set)
                  for u in missing: critical.append(f'Sitemap missing public HTML page: {u}')
                  for u in extras: warnings.append(f'Sitemap URL has no matching HTML page in repo: {u}')
                  if len(sitemap_urls)!=len(sitemap_set): critical.append('Duplicate URL entries in sitemap.xml')
              except Exception as e:
                  critical.append(f'Invalid sitemap.xml: {e}')

          robots=Path('robots.txt')
          if not robots.exists(): critical.append('Missing robots.txt')
          else:
              rt=robots.read_text(encoding='utf-8')
              if 'Sitemap: https://jeddsarte.com/sitemap.xml' not in rt: critical.append('robots.txt missing canonical sitemap declaration')
              if 'Disallow: /' in rt: critical.append('robots.txt blocks entire site')

          print('\n=== WARNINGS ===')
          if warnings:
              for x in warnings: print('WARN:',x)
          else: print('None')
          print('\n=== CRITICAL ===')
          if critical:
              for x in critical: print('CRITICAL:',x)
          else: print('None')
          print(f'\nSUMMARY pages={len(html_files)} warnings={len(warnings)} critical={len(critical)}')
          if critical: raise SystemExit(1)
