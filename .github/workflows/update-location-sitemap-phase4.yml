name: Integrate Phase 4 location pages into sitemap

on:
  push:
    branches:
      - location-pages-phase-4
    paths:
      - .github/workflows/update-location-sitemap-phase4.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: location-pages-phase-4
          fetch-depth: 0
      - name: Add Phase 4 URLs to sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sitemap.xml')
          s = p.read_text()
          urls = [
            ('california', None),('california','los-angeles'),('california','san-diego'),('california','san-francisco'),
            ('new-york', None),('new-york','new-york-city'),
            ('pennsylvania', None),('pennsylvania','philadelphia'),
            ('massachusetts', None),('massachusetts','boston'),
            ('colorado', None),('colorado','denver'),
            ('washington', None),('washington','seattle'),
            ('nevada', None),('nevada','las-vegas')
          ]
          block = ''
          for state, city in urls:
              path = f'https://jeddsarte.com/locations/{state}/' if city is None else f'https://jeddsarte.com/locations/{state}/{city}/'
              if path in s:
                  continue
              priority = '0.7' if city is None else '0.8'
              block += f'  <url>\n    <loc>{path}</loc>\n    <lastmod>2026-09-14</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>{priority}</priority>\n  </url>\n'
          if block:
              marker = '  <!-- Case study pages -->'
              if marker not in s:
                  raise SystemExit('sitemap insertion marker missing')
              s = s.replace(marker, block + '\n' + marker, 1)
              p.write_text(s)
          PY
      - name: Commit sitemap update and remove temporary workflow
        run: |
          rm .github/workflows/update-location-sitemap-phase4.yml
          git config user.name 'Jedd Site Bot'
          git config user.email 'site-bot@users.noreply.github.com'
          git add sitemap.xml .github/workflows/update-location-sitemap-phase4.yml
          git commit -m 'Add Phase 4 location pages to sitemap'
          git push origin location-pages-phase-4