name: SEO Phase 3B Commercial Cluster
on:
  push:
    branches: [seo-phase-3b]
    paths: [.github/workflows/seo-phase3b-commercial-cluster.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-phase-3b
          fetch-depth: 0
      - name: Integrate commercial articles
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_exact(path, old, new, expected=1):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')
              print(path, 'replaced', count)

          # Blog hub: update count and promote new commercial cluster.
          replace_exact('blog/index.html','<h2 style="color:var(--navy);font-size:1.3rem">10 posts</h2>','<h2 style="color:var(--navy);font-size:1.3rem">13 posts</h2>')
          old_featured='''<a href="./law-firm-google-ads-mistakes/" class="featured-post fade-up">\n      <div class="fp-visual">\n        <div class="fp-visual-bg"></div>\n        <div class="fp-visual-glow"></div>\n        <div class="fp-num">01</div>\n        <div class="fp-icon">⚖️</div>\n        <span class="fp-label">Most popular</span>\n      </div>\n      <div class="fp-body">\n        <div class="fp-meta">Google Ads · Legal · June 2026 · 8 min read</div>\n        <h2>Why Law Firm Google Ads Fail Before They Even Launch</h2>\n        <p>The 5 structural mistakes I find in 90% of legal ad account audits - and the exact fixes for each one. If your campaigns are bleeding budget without producing signed cases, start here.</p>\n        <span class="fp-read">Read full post →</span>\n      </div>\n    </a>'''
          new_featured='''<a href="./hire-google-ads-specialist/" class="featured-post fade-up">\n      <div class="fp-visual">\n        <div class="fp-visual-bg"></div>\n        <div class="fp-visual-glow"></div>\n        <div class="fp-num">01</div>\n        <div class="fp-icon">🔎</div>\n        <span class="fp-label">Buyer Guide</span>\n      </div>\n      <div class="fp-body">\n        <div class="fp-meta">Google Ads · Hiring · September 2026 · 10 min read</div>\n        <h2>How to Hire a Google Ads Specialist</h2>\n        <p>What to look for, what to ask, which red flags matter, and how to evaluate a specialist, consultant, freelancer, or agency before handing over budget.</p>\n        <span class="fp-read">Read full guide →</span>\n      </div>\n    </a>'''
          replace_exact('blog/index.html',old_featured,new_featured)

          marker='''    <div class="posts-grid">\n\n      <a href="./server-side-gtm-vs-browser-tracking/" class="post-card fade-up">'''
          cards='''    <div class="posts-grid">\n\n      <a href="./google-ads-management-cost/" class="post-card fade-up">\n        <div class="pc-thumb"><div class="pc-thumb-num">02</div><div class="pc-thumb-icon">💵</div><span class="pc-tag">Pricing</span></div>\n        <div class="pc-body"><div class="pc-meta">September 2026 · 9 min read</div><h3>Google Ads Management Cost: Pricing Guide</h3><p>Compare retainers, percentage-of-spend pricing, hourly work, audits, setup fees, and what a management fee should actually cover.</p><span class="pc-read">Read →</span></div>\n      </a>\n\n      <a href="./google-ads-freelancer-vs-agency/" class="post-card fade-up">\n        <div class="pc-thumb"><div class="pc-thumb-num">03</div><div class="pc-thumb-icon">⚖️</div><span class="pc-tag">Hiring</span></div>\n        <div class="pc-body"><div class="pc-meta">September 2026 · 9 min read</div><h3>Google Ads Freelancer vs Agency</h3><p>Compare senior involvement, capacity, communication, adjacent services, cost structure, and which operating model fits the account.</p><span class="pc-read">Read →</span></div>\n      </a>\n\n      <a href="./law-firm-google-ads-mistakes/" class="post-card fade-up">\n        <div class="pc-thumb"><div class="pc-thumb-num">04</div><div class="pc-thumb-icon">⚖️</div><span class="pc-tag">Legal</span></div>\n        <div class="pc-body"><div class="pc-meta">June 2026 · 8 min read</div><h3>Why Law Firm Google Ads Fail Before They Launch</h3><p>Five structural mistakes that waste expensive legal search demand before optimization can fix the account.</p><span class="pc-read">Read →</span></div>\n      </a>\n\n      <a href="./server-side-gtm-vs-browser-tracking/" class="post-card fade-up">'''
          replace_exact('blog/index.html',marker,cards)

          # Sitemap: make blog hub current and add the three new URLs.
          replace_exact('sitemap.xml','''<loc>https://jeddsarte.com/blog/</loc>\n    <lastmod>2026-07-06</lastmod>''','''<loc>https://jeddsarte.com/blog/</loc>\n    <lastmod>2026-09-01</lastmod>''')
          blog_marker='''  <!-- Blog posts -->\n  <url>\n    <loc>https://jeddsarte.com/blog/law-firm-google-ads-mistakes/</loc>'''
          blog_new='''  <!-- Blog posts -->\n  <url>\n    <loc>https://jeddsarte.com/blog/hire-google-ads-specialist/</loc>\n    <lastmod>2026-09-01</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.8</priority>\n  </url>\n  <url>\n    <loc>https://jeddsarte.com/blog/google-ads-management-cost/</loc>\n    <lastmod>2026-09-01</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.8</priority>\n  </url>\n  <url>\n    <loc>https://jeddsarte.com/blog/google-ads-freelancer-vs-agency/</loc>\n    <lastmod>2026-09-01</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.8</priority>\n  </url>\n  <url>\n    <loc>https://jeddsarte.com/blog/law-firm-google-ads-mistakes/</loc>'''
          replace_exact('sitemap.xml',blog_marker,blog_new)

          # Google Ads service -> commercial decision guides.
          service_old='''<a class="link-card" href="../../blog/google-ads-audit-checklist/"><span>Guide</span><b>Google Ads Audit Checklist</b></a><a class="link-card" href="../../industries/law-firm-google-ads/">'''
          service_new='''<a class="link-card" href="../../blog/google-ads-audit-checklist/"><span>Guide</span><b>Google Ads Audit Checklist</b></a><a class="link-card" href="../../blog/hire-google-ads-specialist/"><span>Buyer Guide</span><b>How to Hire a Google Ads Specialist</b></a><a class="link-card" href="../../blog/google-ads-management-cost/"><span>Pricing Guide</span><b>Google Ads Management Cost</b></a><a class="link-card" href="../../industries/law-firm-google-ads/">'''
          replace_exact('services/google-ads-management/index.html',service_old,service_new)

          # Validate local href targets in the new articles and blog hub.
          check_files=['blog/hire-google-ads-specialist/index.html','blog/google-ads-management-cost/index.html','blog/google-ads-freelancer-vs-agency/index.html','blog/index.html']
          for fp in check_files:
              text=Path(fp).read_text(encoding='utf-8')
              for href in re.findall(r'href="([^"]+)"',text):
                  if href.startswith(('http','mailto:','#')): continue
                  clean=href.split('#')[0].split('?')[0]
                  if not clean: continue
                  base=Path(fp).parent
                  target=(base/clean).resolve()
                  if clean.endswith('/'):
                      target=target/'index.html'
                  if not target.exists():
                      raise SystemExit(f'{fp}: missing local link target {href} -> {target}')
          print('All Phase 3B local links validated')
      - name: Commit Phase 3B integration
        run: |
          git config user.name "Jedd Sarte"
          git config user.email "ajeddsarte@gmail.com"
          git add blog/index.html sitemap.xml services/google-ads-management/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Phase 3B commercial SEO cluster"
          git push origin seo-phase-3b