name: Integrate Knowledge Center Phase 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-knowledge-center-phase1.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch internal links and sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          blog_path = Path('blog/index.html')
          blog = blog_path.read_text(encoding='utf-8')

          nav_anchor = '<li><a href="./index.html" class="active">Insights</a></li>'
          if '../resources/' not in blog and nav_anchor in blog:
              blog = blog.replace(nav_anchor, nav_anchor + '\n      <li><a href="../resources/">Knowledge Center</a></li>', 1)

          hero_marker = '<div class="hero-topics">'
          if 'Explore the Paid Media Knowledge Center' not in blog and hero_marker in blog:
              blog = blog.replace(hero_marker, '<p style="margin:0 0 16px"><a href="../resources/" style="font-family:\'Space Grotesk\',sans-serif;font-weight:800;color:#010829;text-decoration:none">Explore the Paid Media Knowledge Center →</a></p>\n      ' + hero_marker, 1)

          if 'google-ads-conversion-tracking-guide' not in blog:
              m = re.search(r'<div class="posts-grid[^>]*">', blog)
              if m:
                  card = '''\n        <a href="google-ads-conversion-tracking-guide/" class="post-card fade-up" data-topic="google ads tracking">\n          <div class="pc-thumb"><span class="pc-tag">Tracking</span></div>\n          <div class="pc-body"><div class="pc-meta">Google Ads · Measurement</div><h3>Google Ads Conversion Tracking Guide</h3><p>What to track, what not to optimize toward, and how to validate a clean measurement setup.</p><span class="pc-read">Read guide →</span></div>\n        </a>\n'''
                  blog = blog[:m.end()] + card + blog[m.end():]

          blog_path.write_text(blog, encoding='utf-8')

          sitemap_path = Path('sitemap.xml')
          sitemap = sitemap_path.read_text(encoding='utf-8')
          additions = []
          if 'https://jeddsarte.com/resources/' not in sitemap:
              additions.append('''  <url>\n    <loc>https://jeddsarte.com/resources/</loc>\n    <lastmod>2026-09-14</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>0.8</priority>\n  </url>''')
          if 'https://jeddsarte.com/blog/google-ads-conversion-tracking-guide/' not in sitemap:
              additions.append('''  <url>\n    <loc>https://jeddsarte.com/blog/google-ads-conversion-tracking-guide/</loc>\n    <lastmod>2026-09-14</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.8</priority>\n  </url>''')
          if additions:
              sitemap = sitemap.replace('</urlset>', '\n' + '\n'.join(additions) + '\n</urlset>')
              sitemap_path.write_text(sitemap, encoding='utf-8')

          Path('.github/workflows/seo-knowledge-center-phase1.yml').unlink()
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/index.html sitemap.xml .github/workflows/seo-knowledge-center-phase1.yml
          if git diff --cached --quiet; then
            echo "No integration changes needed"
          else
            git commit -m "Integrate knowledge center into site discovery"
            git push origin main
          fi