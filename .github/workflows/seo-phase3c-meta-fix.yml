name: SEO Phase 3C Case Study Metadata Fix

on:
  push:
    branches:
      - seo-phase-3c-audit
    paths:
      - .github/workflows/seo-phase3c-meta-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-phase-3c-audit
      - name: Add missing metadata
        shell: python
        run: |
          from pathlib import Path

          fixes = [
            (
              Path('case-studies/ecommerce/waxit-car-care-australia/index.html'),
              '<title>Andreus Jedd Sarte &middot; Case Study &middot; Waxit Car Care Search Governance</title>',
              '<title>Andreus Jedd Sarte &middot; Case Study &middot; Waxit Car Care Search Governance</title>\n<meta name="description" content="Waxit Car Care Australia Google Ads case study: search-term governance, query classification, negative keyword controls, and a scalable framework for cleaner paid search traffic.">\n<link rel="canonical" href="https://jeddsarte.com/case-studies/ecommerce/waxit-car-care-australia/">'
            ),
            (
              Path('case-studies/real-estate/zahlco-real-estate-maryland/index.html'),
              '<title>Case Study: Zahlco Student Housing Lease-Up</title>',
              '<title>Case Study: Zahlco Student Housing Lease-Up</title>\n<meta name="description" content="Zahlco Real Estate Maryland case study covering paid media strategy for student housing lease-up, campaign execution, and measurable acquisition improvements.">\n<link rel="canonical" href="https://jeddsarte.com/case-studies/real-estate/zahlco-real-estate-maryland/">'
            )
          ]
          for path, old, new in fixes:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one title insertion point, found {text.count(old)}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              print('fixed', path)
      - name: Commit metadata fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-studies/ecommerce/waxit-car-care-australia/index.html case-studies/real-estate/zahlco-real-estate-maryland/index.html
          git commit -m "Add missing case study SEO metadata"
          git push
