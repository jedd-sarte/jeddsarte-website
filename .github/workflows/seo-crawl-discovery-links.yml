name: SEO Crawl Discovery Links

on:
  push:
    branches:
      - seo-crawl-discovery-links
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-crawl-discovery-links
      - name: Add discovery links
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          old = '''</section>\n\n<!-- LOGO MARQUEE -->'''
          new = '''</section>\n\n<!-- SEARCH DISCOVERY LINKS -->\n<section class="crawl-links" aria-label="Google Ads service areas">\n  <div class="crawl-links-inner">\n    <span class="crawl-links-label">Google Ads service areas</span>\n    <a class="crawl-link" href="locations/">All U.S. Locations</a>\n    <a class="crawl-link" href="locations/california/los-angeles/">Los Angeles</a>\n    <a class="crawl-link" href="locations/texas/houston/">Houston</a>\n    <a class="crawl-link" href="locations/florida/miami/">Miami</a>\n    <a class="crawl-link" href="locations/georgia/atlanta/">Atlanta</a>\n    <a class="crawl-link" href="locations/new-york/new-york-city/">New York City</a>\n    <a class="crawl-link" href="locations/colorado/denver/">Denver</a>\n    <a class="crawl-link" href="locations/north-carolina/charlotte/">Charlotte</a>\n    <a class="crawl-link" href="locations/texas/dallas-fort-worth/">Dallas-Fort Worth</a>\n    <a class="crawl-link" href="locations/california/san-diego/">San Diego</a>\n  </div>\n</section>\n\n<!-- LOGO MARQUEE -->'''
          if old in s and 'aria-label="Google Ads service areas"' not in s:
              s = s.replace(old, new, 1)
          s = s.replace('<li><a href="blog/">Insights</a></li>\n      <li><a href="#about">About</a></li>', '<li><a href="blog/">Insights</a></li>\n      <li><a href="locations/">Locations</a></li>\n      <li><a href="#about">About</a></li>', 1)
          s = s.replace('<a href="blog/">Insights</a>\n      <a href="#about">About</a>', '<a href="blog/">Insights</a>\n      <a href="locations/">Locations</a>\n      <a href="#about">About</a>', 1)
          p.write_text(s)

          targets = {
            'industries/law-firm-google-ads/index.html': [
              ('New Orleans legal PPC', '../../locations/louisiana/new-orleans/'),
              ('Memphis legal PPC', '../../locations/tennessee/memphis/'),
              ('Houston legal PPC', '../../locations/texas/houston/'),
              ('Miami legal PPC', '../../locations/florida/miami/'),
              ('New York City legal PPC', '../../locations/new-york/new-york-city/')],
            'industries/google-ads-real-estate/index.html': [
              ('Houston real estate PPC', '../../locations/texas/houston/'),
              ('Dallas-Fort Worth PPC', '../../locations/texas/dallas-fort-worth/'),
              ('Austin PPC', '../../locations/texas/austin/'),
              ('Miami PPC', '../../locations/florida/miami/'),
              ('Phoenix PPC', '../../locations/arizona/phoenix/')],
            'industries/b2b-ppc-management/index.html': [
              ('New York City B2B PPC', '../../locations/new-york/new-york-city/'),
              ('San Francisco B2B PPC', '../../locations/california/san-francisco/'),
              ('Austin B2B PPC', '../../locations/texas/austin/'),
              ('Seattle B2B PPC', '../../locations/washington/seattle/'),
              ('Denver B2B PPC', '../../locations/colorado/denver/')]
          }
          for path, links in targets.items():
              f = Path(path)
              if not f.exists():
                  continue
              t = f.read_text()
              if 'data-seo-location-links' in t:
                  continue
              block = '<section data-seo-location-links style="padding:28px 32px;background:#f8f9ff;border-top:1px solid #e0e0ec"><div style="max-width:1100px;margin:auto"><strong style="color:#010829">Related U.S. markets:</strong> ' + ' · '.join(f'<a href="{href}">{label}</a>' for label, href in links) + ' · <a href="../../locations/">All locations</a></div></section>'
              t = t.replace('</main>', block + '\n</main>', 1) if '</main>' in t else t.replace('</body>', block + '\n</body>', 1)
              f.write_text(t)

          wf = Path('.github/workflows/seo-crawl-discovery-links.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Strengthen crawl paths to location pages"
          git push origin HEAD:seo-crawl-discovery-links
