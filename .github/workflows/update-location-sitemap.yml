name: Integrate location pages into sitemap

on:
  push:
    branches:
      - location-pages-phase-2
    paths:
      - .github/workflows/update-location-sitemap.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: location-pages-phase-2
          fetch-depth: 0
      - name: Add location URLs to sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sitemap.xml')
          s = p.read_text()
          urls = [
              ('https://jeddsarte.com/locations/', '0.8'),
              ('https://jeddsarte.com/locations/louisiana/', '0.7'),
              ('https://jeddsarte.com/locations/louisiana/new-orleans/', '0.8'),
              ('https://jeddsarte.com/locations/texas/', '0.7'),
              ('https://jeddsarte.com/locations/texas/houston/', '0.8'),
              ('https://jeddsarte.com/locations/tennessee/', '0.7'),
              ('https://jeddsarte.com/locations/tennessee/memphis/', '0.8'),
              ('https://jeddsarte.com/locations/tennessee/nashville/', '0.8'),
          ]
          if 'https://jeddsarte.com/locations/' not in s:
              lines = ['  <!-- Location pages -->']
              for url, priority in urls:
                  lines.extend([
                      '  <url>',
                      f'    <loc>{url}</loc>',
                      '    <lastmod>2026-09-14</lastmod>',
                      '    <changefreq>monthly</changefreq>',
                      f'    <priority>{priority}</priority>',
                      '  </url>',
                  ])
              block = '\n'.join(lines) + '\n\n'
              marker = '  <!-- Case study pages -->'
              if marker not in s:
                  raise SystemExit('sitemap insertion marker missing')
              s = s.replace(marker, block + marker, 1)
          p.write_text(s)
          PY
      - name: Commit sitemap update and remove temporary workflow
        run: |
          rm .github/workflows/update-location-sitemap.yml
          git config user.name 'Jedd Site Bot'
          git config user.email 'site-bot@users.noreply.github.com'
          git add sitemap.xml .github/workflows/update-location-sitemap.yml
          git commit -m 'Add location pages to sitemap'
          git push origin location-pages-phase-2