name: Integrate location pages into sitemap

on:
  push:
    branches:
      - location-pages-phase-2
    paths:
      - .github/workflows/update-location-sitemap.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: location-pages-phase-2
          fetch-depth: 0
      - name: Add location URLs to sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sitemap.xml')
          s=p.read_text()
          block='''  <!-- Location pages -->
  <url><loc>https://jeddsarte.com/locations/</loc><lastmod>2026-09-14</lastmod><changefreq>monthly</changefreq><priority>0.8</priority></url>
  <url><loc>https://jeddsarte.com/locations/louisiana/</loc><lastmod>2026-09-14</lastmod><changefreq>monthly</changefreq><priority>0.7</priority></url>
  <url><loc>https://jeddsarte.com/locations/louisiana/new-orleans/</loc><lastmod>2026-09-14</lastmod><changefreq>monthly</changefreq><priority>0.8</priority></url>
  <url><loc>https://jeddsarte.com/locations/texas/</loc><lastmod>2026-09-14</lastmod><changefreq>monthly</changefreq><priority>0.7</priority></url>
  <url><loc>https://jeddsarte.com/locations/texas/houston/</loc><lastmod>2026-09-14</lastmod><changefreq>monthly</changefreq><priority>0.8</priority></url>
  <url><loc>https://jeddsarte.com/locations/tennessee/</loc><lastmod>2026-09-14</lastmod><changefreq>monthly</changefreq><priority>0.7</priority></url>
  <url><loc>https://jeddsarte.com/locations/tennessee/memphis/</loc><lastmod>2026-09-14</lastmod><changefreq>monthly</changefreq><priority>0.8</priority></url>
  <url><loc>https://jeddsarte.com/locations/tennessee/nashville/</loc><lastmod>2026-09-14</lastmod><changefreq>monthly</changefreq><priority>0.8</priority></url>

'''
          if 'https://jeddsarte.com/locations/' not in s:
              marker='  <!-- Case study pages -->'
              if marker not in s:
                  raise SystemExit('sitemap insertion marker missing')
              s=s.replace(marker,block+marker,1)
          p.write_text(s)
          PY
      - name: Commit sitemap update and remove temporary workflow
        run: |
          rm .github/workflows/update-location-sitemap.yml
          git config user.name 'Jedd Site Bot'
          git config user.email 'site-bot@users.noreply.github.com'
          git add sitemap.xml .github/workflows/update-location-sitemap.yml
          git commit -m 'Add location pages to sitemap'
          git push origin location-pages-phase-2