name: Patch Services Nav
on:
  push:
    branches: [main]
    paths: [.github/workflows/patch-services-nav.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align Services navigation with homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('services/index.html')
          s=p.read_text()
          old_css="""nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(3,14,79,0.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(244,159,28,0.1);padding:16px 32px;transition:padding 0.3s}\n.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}\n.nav-logo{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.05rem;color:var(--white);text-decoration:none}\n.nav-logo span{color:var(--gold)}\n.nav-links{display:flex;gap:28px;list-style:none}\n.nav-links a{color:rgba(255,255,255,0.6);text-decoration:none;font-size:0.85rem;font-family:'Space Grotesk',sans-serif;font-weight:600;transition:color 0.2s}\n.nav-links a:hover,.nav-links a.active{color:var(--gold)}\n.nav-cta{background:var(--gold)!important;color:var(--navy)!important;padding:9px 20px;border-radius:6px!important;font-weight:700!important}\n.nav-cta:hover{background:var(--gold-light)!important}"""
          new_css="""nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(3,14,79,0.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(244,159,28,0.12);padding:16px 32px;transition:padding 0.3s}\n.nav-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px}\n.nav-logo{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.05rem;color:var(--white);text-decoration:none;letter-spacing:-0.02em}\n.nav-logo span{color:var(--gold)}\n.nav-links{display:flex;gap:8px;list-style:none;align-items:center}\n.nav-links a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.82rem;font-family:'Space Grotesk',sans-serif;font-weight:600;transition:all 0.2s;letter-spacing:0.01em;padding:9px 11px;border-radius:8px}\n.nav-links a:hover{color:var(--white);background:rgba(255,255,255,.06)}\n.nav-links a.active{color:var(--gold)}\n.nav-cta{background:var(--gold)!important;color:var(--navy)!important;padding:10px 18px!important;border-radius:9px!important;font-weight:700!important;box-shadow:0 8px 24px rgba(244,159,28,.2)}\n.nav-cta:hover{background:var(--gold-light)!important;transform:translateY(-1px)}\n.menu-toggle{display:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:9px;padding:9px 11px;font:700 .8rem 'Space Grotesk',sans-serif;cursor:pointer}\n.mobile-menu{display:none;position:absolute;top:68px;left:20px;right:20px;background:rgba(1,8,41,.99);border:1px solid rgba(244,159,28,.18);border-radius:14px;padding:12px;box-shadow:0 20px 40px rgba(0,0,0,.3)}\n.mobile-menu.open{display:grid}\n.mobile-menu a{color:rgba(255,255,255,.82);text-decoration:none;font:600 .9rem 'Space Grotesk',sans-serif;padding:12px;border-radius:8px}\n.mobile-menu a:hover{background:rgba(255,255,255,.06);color:var(--gold)}"""
          if old_css not in s: raise SystemExit('old nav css not found')
          s=s.replace(old_css,new_css)
          s=s.replace("html{scroll-behavior:smooth}","html{scroll-behavior:smooth;scroll-padding-top:88px}")
          s=s.replace("#services{padding:96px 0;background:var(--white)}","#services{padding:96px 0;background:var(--white);scroll-margin-top:88px}")
          old_mobile="  nav .nav-links{display:none}\n  .footer-inner{flex-direction:column;text-align:center}"
          new_mobile="  nav .nav-links{display:none}\n  .menu-toggle{display:inline-flex}\n  .mobile-menu{z-index:250}\n  .footer-inner{flex-direction:column;text-align:center}"
          if old_mobile not in s: raise SystemExit('mobile css not found')
          s=s.replace(old_mobile,new_mobile)
          old_nav='''<nav id="nav">\n  <div class="nav-inner">\n    <a href="../index.html" class="nav-logo">Jedd<span>.</span></a>\n    <ul class="nav-links">\n      <li><a href="./index.html" class="active">Services</a></li>\n      <li><a href="../industries/">Industries</a>\n        <a href="../industries/law-firm-google-ads/">Law Firms</a>\n        <a href="../industries/google-ads-contractors/">Contractors</a>\n        <a href="../industries/google-ads-medical-practices/">Medical</a></li>\n      <li><a href="../case-studies/">Case Studies</a></li>\n      <li><a href="../blog/">Insights</a></li>\n      <li><a href="../index.html#about">About</a></li>\n      <li><a href="https://calendar.app.google/2RJj6td6D5g3GgfC7" target="_blank" class="nav-cta">Book a Call</a></li>\n    </ul>\n  </div>\n</nav>'''
          new_nav='''<nav id="nav">\n  <div class="nav-inner">\n    <a href="../" class="nav-logo">Jedd<span>.</span></a>\n    <ul class="nav-links">\n      <li><a href="./" class="active">Services</a></li>\n      <li><a href="../industries/">Industries</a></li>\n      <li><a href="../case-studies/">Case Studies</a></li>\n      <li><a href="../blog/">Insights</a></li>\n      <li><a href="../#about">About</a></li>\n      <li><a href="https://calendar.app.google/2RJj6td6D5g3GgfC7" target="_blank" rel="noopener" class="nav-cta">Book a Call</a></li>\n    </ul>\n    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu">Menu</button>\n    <div id="mobile-menu" class="mobile-menu">\n      <a href="./">Services</a>\n      <a href="../industries/">Industries</a>\n      <a href="../case-studies/">Case Studies</a>\n      <a href="../blog/">Insights</a>\n      <a href="../#about">About</a>\n      <a href="https://calendar.app.google/2RJj6td6D5g3GgfC7" target="_blank" rel="noopener">Book a Strategy Call →</a>\n    </div>\n  </div>\n</nav>'''
          if old_nav not in s: raise SystemExit('old nav markup not found')
          s=s.replace(old_nav,new_nav)
          old_script="""const obs=new IntersectionObserver(e=>{e.forEach(i=>{if(i.isIntersecting){i.target.classList.add('visible');obs.unobserve(i.target)}})},{threshold:0.1});\ndocument.querySelectorAll('.fade-up').forEach(el=>obs.observe(el));\nwindow.addEventListener('scroll',()=>{\n  document.getElementById('nav').style.padding=window.scrollY>60?'10px 32px':'16px 32px';\n});"""
          new_script="""const obs=new IntersectionObserver(e=>{e.forEach(i=>{if(i.isIntersecting){i.target.classList.add('visible');obs.unobserve(i.target)}})},{threshold:0.1});\ndocument.querySelectorAll('.fade-up').forEach(el=>obs.observe(el));\nconst primaryNav=document.getElementById('nav');\nconst menuToggle=document.querySelector('.menu-toggle');\nconst mobileMenu=document.querySelector('.mobile-menu');\nif(menuToggle&&mobileMenu){\n  menuToggle.addEventListener('click',()=>{\n    const open=mobileMenu.classList.toggle('open');\n    menuToggle.setAttribute('aria-expanded',String(open));\n    menuToggle.textContent=open?'Close':'Menu';\n  });\n  mobileMenu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{\n    mobileMenu.classList.remove('open');\n    menuToggle.setAttribute('aria-expanded','false');\n    menuToggle.textContent='Menu';\n  }));\n}\nwindow.addEventListener('scroll',()=>{\n  if(primaryNav) primaryNav.style.padding=window.scrollY>60?'10px 32px':'16px 32px';\n});"""
          if old_script not in s: raise SystemExit('old script not found')
          s=s.replace(old_script,new_script)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "jedd-sarte"
          git config user.email "actions@users.noreply.github.com"
          git add services/index.html
          git commit -m "Fix Services header consistency and scroll offset"
          git push origin HEAD:main
